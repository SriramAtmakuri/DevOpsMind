version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devopsmind-db
    environment:
      POSTGRES_DB: devopsmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devopsmind_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devopsmind-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devopsmind
      DB_USER: postgres
      DB_PASSWORD: devopsmind_password
      JWT_SECRET: change_this_to_a_secure_random_string_in_production
      AI_API_URL: http://host.docker.internal:11434/v1/chat/completions
      AI_MODEL: llama3.2
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: devopsmind-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
